services:
  db:
    image: mariadb:10.5
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nettrader
      MYSQL_USER: nettrader_user
      MYSQL_PASSWORD: nettrader_password
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mysql_dump.sql:/docker-entrypoint-initdb.d/mysql_dump.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: nettrader
      DB_USER: nettrader_user
      DB_PASSWORD: nettrader_password
      CRON_SECRET: "nettrader_cron_secure_token_secret"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      IGNORE_MARKET_HOURS: "${IGNORE_MARKET_HOURS:-0}"
      BACKUP_DIR: /app/backups
    volumes:
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Interface Web pour lire les e-mails
      - "1025:1025" # Port SMTP interne utilisé par msmtp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  db-backup-hourly:
    image: databack/mysql-backup:latest
    container_name: nettrader-backup-hourly
    environment:
      DB_SERVER: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: rootpassword
      DB_DUMP_INCLUDE: nettrader
      DB_DUMP_CRON: "0 * * * *"     # Exécution chaque heure (à la minute 0)
      DB_DUMP_RETENTION: 24h        # Rétention glissante sur 24 heures
      DB_DUMP_TARGET: /backups/hourly
    volumes:
      - ./backups/hourly:/backups/hourly
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db-backup-daily:
    image: databack/mysql-backup:latest
    container_name: nettrader-backup-daily
    environment:
      DB_SERVER: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: rootpassword
      DB_DUMP_INCLUDE: nettrader
      DB_DUMP_CRON: "0 2 * * *"     # Exécution quotidienne à 02:00
      DB_DUMP_RETENTION: 30d        # Rétention glissante sur 30 jours
      DB_DUMP_TARGET: /backups/daily
    volumes:
      - ./backups/daily:/backups/daily
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mariadb_data:

